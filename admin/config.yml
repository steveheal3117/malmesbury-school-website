# Staff website editor (Decap CMS). Changes are saved as proposals and
# only go live after an approver (head, deputy head or business manager) approves them.
backend:
  name: github
  repo: steveheal3117/malmesbury-school-website
  branch: main
  base_url: https://malmesburyprimaryschool.co.uk
  auth_endpoint: api/auth
  squash_merges: true
  commit_messages:
    create: 'Create {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'
publish_mode: editorial_workflow
site_url: https://malmesburyprimaryschool.co.uk
display_url: https://malmesburyprimaryschool.co.uk
locale: en
media_folder: assets/images
public_folder: /images/photos
collections:
  - name: home-and-news
    label: "Home and News"
    editor: {preview: true}
    files:
      - name: home-headteachers-welcome
        label: "Headteacher's Welcome"
        file: content/home/headteachers-welcome.md
        preview_path: headteachers-welcome/
        fields:
          - {label: "Page title", name: title, widget: string}
          - {label: "Page text", name: body, widget: richtext, modes: [rich_text, raw]}
      - name: news-index
        label: "News"
        file: content/news/index.md
        preview_path: news/
        fields:
          - {label: "Page title", name: title, widget: string}
