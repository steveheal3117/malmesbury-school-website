<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 345" width="320" height="345">
  <rect width="320" height="345" fill="#f6f6f4"/>
  <!-- wrist strap -->
  <g>
    <path d="M140 20 L180 20 L186 110 L134 110 Z" fill="#231f20"/>
    <path d="M140 210 L180 210 L186 300 L134 300 Z" fill="#231f20"/>
  </g>
  <!-- watch body -->
  <g>
    <rect x="110" y="95" width="100" height="130" rx="22" ry="22" fill="#1f3a5f"/>
    <rect x="122" y="107" width="76" height="106" rx="12" ry="12" fill="#ffffff"/>
  </g>
  <!-- side button -->
  <rect x="207" y="140" width="10" height="24" rx="3" fill="#1f3a5f"/>
  <!-- screen face: time + simple watch hands -->
  <g>
    <circle cx="160" cy="150" r="26" fill="none" stroke="#8f1d2c" stroke-width="3"/>
    <line x1="160" y1="150" x2="160" y2="133" stroke="#8f1d2c" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="150" x2="172" y2="155" stroke="#8f1d2c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="160" cy="150" r="2.5" fill="#8f1d2c"/>
    <text x="160" y="195" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#1f3a5f">09:41</text>
  </g>
  <text x="160" y="330" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" fill="#1f3a5f">Smart watch</text>
</svg>
